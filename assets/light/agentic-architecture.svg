<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">The creator is not the only judge.</title>
<desc id="desc">Generalized evaluation architecture: generate, independently verify, adversarially measure, deterministic gates, human review, batch oversight and persisted learning. Bounded repair returns from gates to generation; persisted learning feeds future generation.</desc>
